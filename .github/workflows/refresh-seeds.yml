name: Refresh Seeds

# Refreshes the static seed snapshots (yield-pools, FRED, blended-stable
# APY) used by /rates as a fallback when DefiLlama or FRED upstream
# stalls on a cold Vercel instance. Runs the same capture scripts that
# live in scripts/capture-*-seed.ts — single source of truth.
#
# Triggers:
#   - workflow_dispatch (manual or fired by the Cloudflare Worker cron
#     in worker/cloudflare-cron). The Worker dispatches against the
#     current production branch.
#   - schedule (Sundays 02:00 UTC) — fallback so the seeds refresh even
#     if the Cloudflare cron is paused or misconfigured. Belt-and-braces.
#
# After running, if anything changed, the workflow:
#   1. Commits the updated snapshot files back to the branch.
#   2. Pings the Vercel deploy hook (if VERCEL_DEPLOY_HOOK secret is
#      set) so prod picks up the new seeds without a manual redeploy.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run was triggered (manual / cron / one-off)"
        required: false
        default: "manual"
  schedule:
    # Sunday 02:00 UTC. Doesn't matter exactly when — FRED and DefiLlama
    # both publish daily, weekly cadence is plenty.
    - cron: "0 2 * * 0"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture yield-pools seed
        run: npx tsx scripts/capture-yield-pools-seed.ts

      - name: Capture FRED seed
        run: npx tsx scripts/capture-fred-seed.ts

      - name: Capture blended-stable APY seed
        run: npx tsx scripts/capture-blended-stable-seed.ts

      - name: Commit seed updates (if any)
        id: commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only stage the three seed files — don't sweep up anything else
          # that might have been touched.
          git add content/snapshots/yield-pools-seed.json \
                  content/snapshots/fred-seed.json \
                  content/snapshots/blended-stable-apy-seed.json
          if git diff --cached --quiet; then
            echo "No seed changes — skipping commit + redeploy."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          REASON="${{ github.event.inputs.reason }}"
          if [ -z "$REASON" ]; then REASON="cron"; fi
          git commit -m "chore(seeds): weekly refresh ($REASON)" \
                     -m "Auto-generated by .github/workflows/refresh-seeds.yml"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Trigger Vercel redeploy
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Triggering Vercel deploy hook…"
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK")
          echo "Deploy hook returned HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::warning::Deploy hook returned non-2xx; check Vercel dashboard"
          fi
