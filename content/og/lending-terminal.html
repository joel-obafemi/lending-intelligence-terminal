<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ethereum Lending Terminal — OG Card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    background: #0E1B2C;
    overflow: hidden;
    font-family: 'Source Serif 4', 'Liberation Serif', Georgia, serif;
    color: #F7F4ED;
  }

  .card {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 50% at 50% 50%, rgba(31, 58, 95, 0.45) 0%, rgba(14, 27, 44, 0) 70%),
      radial-gradient(circle at 85% 15%, rgba(31, 58, 95, 0.35) 0%, rgba(14, 27, 44, 0) 50%),
      #0E1B2C;
    display: flex;
    flex-direction: column;
  }

  /* Top chrome row */
  .chrome-top {
    padding: 44px 60px 0 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-mark {
    width: 10px;
    height: 10px;
    background: #3A55FF;
    border-radius: 50%;
  }

  .brand-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #3A55FF;
    font-weight: 500;
  }

  .brand-icon {
    width: 56px;
    height: 56px;
    background: rgba(247, 244, 237, 0.04);
    border: 1px solid rgba(247, 244, 237, 0.10);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-icon img {
    width: 44px;
    height: 44px;
    display: block;
  }

  /* Center hero */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0 80px;
  }

  .wordmark {
    font-family: 'Source Serif 4', 'Liberation Serif', Georgia, serif;
    font-size: 76px;
    line-height: 1.0;
    font-weight: 700;
    letter-spacing: -0.022em;
    color: #F7F4ED;
    text-align: center;
    white-space: nowrap;
    display: inline-flex;
    align-items: baseline;
    gap: 14px;
  }

  .wordmark .cursor {
    display: inline-block;
    width: 44px;
    height: 7px;
    background: #3A55FF;
    border-radius: 1px;
    transform: translateY(-8px);
  }

  /* Bottom chrome row */
  .chrome-bottom {
    padding: 0 60px 44px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .url {
    font-family: 'JetBrains Mono', 'Liberation Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: rgba(247, 244, 237, 0.75);
    font-weight: 500;
  }

  .protocols {
    font-family: 'JetBrains Mono', 'Liberation Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(247, 244, 237, 0.55);
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="chrome-top">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-text">Datum Labs Research</div>
      </div>
      <div class="brand-icon">
        <img src="../../public/branding/datumlabs-icon.png" alt="Datum Labs"/>
      </div>
    </div>

    <div class="hero">
      <div class="wordmark">
        Ethereum Lending Terminal<span class="cursor"></span>
      </div>
    </div>

    <div class="chrome-bottom">
      <div class="url">datumlab.xyz/lending-terminal</div>
      <div class="protocols">Six Protocols · One Terminal</div>
    </div>
  </div>
</body>
</html>
