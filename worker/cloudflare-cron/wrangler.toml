name = "lending-terminal-cron"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Schedules. Each cron string here must have a matching entry in
# CRON_JOBS in src/index.ts so the worker knows what to dispatch.
#
# Adding a new job? Add the cron + handler here AND in CRON_JOBS, then
# `wrangler deploy`.
[triggers]
crons = [
  "0 1 * * *",     # daily 01:00 UTC — fires sector-snapshot Next.js endpoint
  "0 2 * * SUN",   # Sundays 02:00 UTC — dispatches the refresh-seeds GitHub workflow
  # NB: Cloudflare's cron parser uses 1-7 (or MON-SUN) for day-of-week,
  # not the more common 0-6. `0 2 * * 0` is rejected with code 10100.
]

[vars]
# Production origin — the canonical Vercel URL for the Next.js app.
# Endpoint paths are appended by the worker. If the domain ever changes,
# update here and re-run `wrangler deploy`.
BASE_URL = "https://lending-intelligence-terminal.vercel.app"

# GitHub repo + branch the seed-refresh workflow runs on. The Worker
# dispatches against this branch; the workflow's `git push` lands here.
GITHUB_REPO = "joel-obafemi/lending-intelligence-terminal"
GITHUB_BRANCH = "feat/alerts-mvp"
SEED_WORKFLOW_FILE = "refresh-seeds.yml"

# Observability — lightweight, free tier friendly.
[observability]
enabled = true

# Secrets that must be set via `wrangler secret put`:
#   - CRON_SECRET    Bearer token shared with the Next.js /api/cron/* endpoints
#   - GITHUB_TOKEN   Fine-grained PAT with `actions:write` + `contents:read`
#                    on the lending-intelligence-terminal repo, used to
#                    dispatch the refresh-seeds workflow.
