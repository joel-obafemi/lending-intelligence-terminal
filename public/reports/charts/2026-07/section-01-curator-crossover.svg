  <text class="caption" x="48" y="440">Morpho V1 + V2 combined curator TVL share at May 31, June 30, and July 31, 2026. Sentora climbed from #2 to #1 between May and June; Steakhouse dipped and partly recovered; Gauntlet declined for the second consecutive month.</text>
